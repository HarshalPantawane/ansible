######   nginx installing and start ######

- name: install and start svc      # name of playbook
  host: local module               # where you want to perform

  task: 
  - name: installing nginx         # task name
    yum:                           # module 
      name: nginx                  # 
      state: present               # Ensure the package should is installed

  - name: start nginx
    service:                        # module
      name: nginx
      state: started
      enable: true                 


---
#### httpd installing and start ###########

- name: install and start svc
  host: localhost

  task:
  - name: installing httpd
    yum:
      name: httpd
      state: present

  - name: start httpd
    service:
      name: httpd
      state: started
      enable: true

